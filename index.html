<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질문서고+ | 수봉도서관</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEDE6;
  --card:#F7F6F1;
  --ink:#17262B;
  --muted:#6E7A76;
  --rule:#CFCCC0;
  --accent:#B8791F;
  --accent-soft:#EFE2CB;
  --sans:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --mono:'IBM Plex Mono','D2Coding',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:780px;margin:0 auto;padding:0 20px 96px}

/* ── 머리말 ── */
header{padding:56px 0 32px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px
}
h1{
  font-family:var(--serif);font-weight:700;
  font-size:clamp(38px,8vw,60px);line-height:1.05;
  margin:0 0 18px;letter-spacing:-.02em
}
h1 .plus{color:var(--accent)}
.lede{
  font-family:var(--serif);font-size:17px;color:var(--muted);
  margin:0;max-width:34em;line-height:1.85;
  word-break:keep-all;overflow-wrap:break-word
}
.br-wide{display:inline}

/* ── 검색 ── */
.search{position:relative;margin:34px 0 20px}
.search input{
  width:100%;padding:17px 52px 17px 20px;
  font-family:var(--sans);font-size:16px;color:var(--ink);
  background:var(--card);
  border:1px solid var(--rule);border-radius:2px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.search input::placeholder{color:#9AA29E}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .glyph{
  position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:15px;color:var(--muted);pointer-events:none
}

/* ── 검색 범위 ── */
.scope{display:flex;align-items:center;gap:0;margin:0 0 18px;flex-wrap:wrap}
.scope-label{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-right:11px
}
.scope-btn{
  font-family:var(--sans);font-size:12.5px;
  padding:5px 12px;border:1px solid var(--rule);
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .15s;line-height:1.5;margin-right:-1px
}
.scope-btn:first-of-type{border-radius:2px 0 0 2px}
.scope-btn:last-of-type{border-radius:0 2px 2px 0}
.scope-btn:hover{color:var(--ink)}
.scope-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;z-index:1}
.scope-btn[aria-pressed="true"]{
  background:var(--accent-soft);border-color:#D8BE8E;
  color:#7A5312;font-weight:500;position:relative;z-index:1
}

/* ── 필터 ── */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{
  font-family:var(--sans);font-size:13px;font-weight:400;
  padding:6px 13px;border:1px solid var(--rule);border-radius:100px;
  background:transparent;color:var(--muted);cursor:pointer;
  transition:all .15s;line-height:1.5
}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{
  background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500
}
.chip .n{font-family:var(--mono);font-size:11px;opacity:.6;margin-left:5px}

.count{
  font-family:var(--mono);font-size:12px;color:var(--muted);
  padding:12px 0 6px;border-top:1px solid var(--rule)
}

/* ── 질문 남기기 ── */
.ask{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:20px 22px;margin:0 0 30px
}
.ask-h{
  font-family:var(--serif);font-size:16.5px;margin:0 0 13px;color:var(--ink)
}
.ask-b{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.ask-btn{
  display:inline-block;font-family:var(--sans);font-size:14px;font-weight:500;
  padding:9px 18px;background:var(--ink);color:var(--paper);
  text-decoration:none;border-radius:2px;transition:background .15s;white-space:nowrap
}
.ask-btn:hover{background:var(--accent)}
.ask-btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.ask-or{font-size:13.5px;color:var(--muted);line-height:1.7}

/* ── 카드 ── */
.list{display:flex;flex-direction:column}
.entry{
  border-bottom:1px solid var(--rule);
  padding:26px 0 26px 62px;position:relative;
}
.entry:first-child{border-top:1px solid var(--rule)}
.callno{
  position:absolute;left:0;top:28px;
  font-family:var(--mono);font-size:11px;color:var(--muted);
  letter-spacing:.04em
}
.meta{
  font-size:12.5px;color:var(--muted);margin-bottom:8px;
  display:flex;gap:9px;align-items:baseline;flex-wrap:wrap
}
.meta .nick{color:var(--ink);font-weight:500}
.meta .date{font-family:var(--mono);font-size:11px}
.q{
  font-family:var(--serif);font-size:18.5px;line-height:1.62;
  margin:0 0 12px;cursor:pointer;letter-spacing:-.005em;
  word-break:keep-all;overflow-wrap:break-word
}
.q:hover{color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{
  font-size:11.5px;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;
  background:transparent;cursor:pointer;font-family:var(--sans);line-height:1.6
}
.tag:hover{border-color:var(--ink);color:var(--ink)}
.tag:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tag.kind{background:var(--accent-soft);border-color:var(--accent-soft);color:#7A5312}
.toggle{
  margin-left:auto;font-family:var(--mono);font-size:11px;
  color:var(--muted);background:none;border:none;cursor:pointer;padding:2px 0
}
.toggle:hover{color:var(--accent)}
.toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── 답변 ── */
.a{display:none;margin-top:18px}
.entry.open .a{display:block}
.a-body{
  background:var(--card);border-left:2px solid var(--accent);
  padding:18px 20px;font-size:15px;line-height:1.85;
  white-space:pre-wrap;border-radius:0 2px 2px 0
}
.books{margin-top:14px;display:flex;flex-direction:column;gap:1px}
.books-h{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;margin-bottom:7px
}
.book{
  display:flex;gap:12px;align-items:baseline;
  padding:8px 0;border-bottom:1px dotted var(--rule)
}
.book:last-child{border-bottom:none}
.book .t{font-family:var(--serif);font-size:15px;flex:1}
.book .c{
  font-family:var(--mono);font-size:11.5px;color:var(--accent);
  white-space:nowrap;letter-spacing:.02em
}
.nobook{font-size:12.5px;color:var(--muted);margin-top:12px;font-style:italic}

/* ── 불러오는 중 / 오류 ── */
.status{padding:72px 0;text-align:center;color:var(--muted)}
.s-title{font-family:var(--serif);font-size:17px;margin:0 0 8px;color:var(--ink)}
.s-sub{font-size:13.5px;margin:0 0 14px}
.s-detail{font-family:var(--mono);font-size:11px;color:#A8A497;margin:0}
.spin{
  display:inline-block;width:11px;height:11px;margin-right:9px;
  border:1.5px solid var(--rule);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px
}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

.empty{padding:64px 0;text-align:center;color:var(--muted)}
.empty p{margin:0 0 8px;font-family:var(--serif);font-size:17px}
.empty span{font-size:13.5px}
.widen{
  font-family:var(--sans);font-size:13px;color:var(--accent);
  background:none;border:none;border-bottom:1px solid var(--accent);
  cursor:pointer;padding:0 0 1px;margin-left:2px
}
.widen:hover{color:var(--ink);border-color:var(--ink)}
.widen:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

mark{background:var(--accent-soft);color:inherit;padding:0 1px}

footer{
  margin-top:56px;padding-top:20px;border-top:1px solid var(--rule);
  font-size:12.5px;color:var(--muted)
}
footer .mono{font-family:var(--mono);font-size:11px}

@media(max-width:560px){
  header{padding:40px 0 24px}
  h1{font-size:clamp(34px,11vw,46px)}
  .lede{font-size:15.5px;line-height:1.8}
  .br-wide{display:none}          /* 좁은 화면에선 문장이 이어서 흐르게 */
  .ask{padding:17px 18px}
  .ask-b{gap:10px}
  .ask-btn{width:100%;text-align:center}
  .entry{padding-left:0;padding-top:24px}
  .callno{position:static;display:block;margin-bottom:6px}
  .toggle{margin-left:0;width:100%;text-align:left;margin-top:6px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">수봉도서관 정보서비스</p>
  <h1>질문서고<span class="plus">+</span></h1>
  <p class="lede">궁금하거나, 나누고 싶은 마음을 남기면 사서가 답변을 달아 드립니다.<br class="br-wide">지금까지 오간 질문과 답변을 구경해 보세요.</p>

  <div class="search">
    <input id="q" type="search" placeholder="궁금한 낱말을 넣어 보세요 — 도서관, 공부, 친구" aria-label="질문 검색">
    <span class="glyph">↩</span>
  </div>

  <div class="scope" role="group" aria-label="검색할 범위">
    <span class="scope-label">찾는 곳</span>
    <button class="scope-btn" data-scope="q" aria-pressed="true">질문</button>
    <button class="scope-btn" data-scope="all" aria-pressed="false">답변·책 제목까지</button>
  </div>

  <div class="filters" id="filters" role="group" aria-label="질문 종류로 추리기"></div>
  <div class="count" id="count"></div>
</header>

<section class="ask">
  <p class="ask-h">질문을 하고 싶으신가요?</p>
  <p class="ask-b">
    <a class="ask-btn" href="https://docs.google.com/forms/d/e/1FAIpQLScq8px13kIEF59-EenxWP4arMiymAkKDNT8xzzwzZMvVtTniw/viewform"
       target="_blank" rel="noopener">온라인으로 질문 남기기</a>
    <span class="ask-or">또는 수봉도서관 1층 로비 ‘질문서고’함에 직접 질문을 넣어 주세요.</span>
  </p>
</section>

<main class="list" id="list"></main>

<footer>
  <div>수봉도서관 2층 열린누리에서 답변하고 있습니다.</div>
  <div class="mono" id="stamp"></div>
</footer>

</div>

<script>
/* ─────────────────────────────────────────────
   구글 스프레드시트 연결
   시트에 행을 더하면 이 화면에도 그대로 나옵니다.
   (구글이 몇 분간 내용을 저장해 두므로 바로 안 보일 수 있어요)

   주소를 둘 준비해 두고 되는 쪽을 씁니다.
   ① gviz  — 중간에 다른 서버를 거치지 않아 잘 끊기지 않습니다
   ② 게시 CSV — 예비
   ───────────────────────────────────────────── */
const SHEET_ID  = '1qYSG-z1qeRmB0NwDPXcmBcG1ZK9xQcctbl-q6yndIVY';
const SHEET_GID = '0';
const SHEET_URLS = [
  'https://docs.google.com/spreadsheets/d/'+SHEET_ID+
    '/gviz/tq?tqx=out:csv&headers=1&gid='+SHEET_GID,
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vRgus2eIFKPFBdoHe4x24PSYsFu9F7cGS_as18gR3-iOWDw0VYYYHppHlT6qG6guj_ispugSHIQ3b3t/pub?output=csv'
];

/* CSV 읽기 — 따옴표 안의 쉼표·줄바꿈·겹따옴표를 모두 견딘다 */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  const rows=[]; let row=[], cell='', quoted=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(quoted){
      if(c==='"'){
        if(text[i+1]==='"'){cell+='"';i++;}
        else quoted=false;
      } else cell+=c;
    } else {
      if(c==='"') quoted=true;
      else if(c===','){row.push(cell);cell='';}
      else if(c==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
      else cell+=c;
    }
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(v=>v.trim()!==''));
}

/* 추천도서 — 두 가지 표기를 모두 읽는다
   ① <서명> (청구기호)     ② 서명|청구기호            */
function parseBooks(raw){
  if(!raw||!raw.trim())return [];
  return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    if(line.includes('|')){
      const p=line.split('|');
      return {title:p[0].trim(), call:(p[1]||'').trim()};
    }
    let m=line.match(/^<(.+)>\s*\((.+)\)\s*$/);          // <서명> (청구기호)
    if(m) return {title:m[1].trim(), call:m[2].trim()};
    m=line.match(/^<(.+)>\s*$/);                          // <서명>만
    if(m) return {title:m[1].trim(), call:''};
    m=line.match(/^(.+?)\s*\(([^()]*[0-9][^()]*)\)\s*$/); // 서명 (청구기호)
    if(m) return {title:m[1].trim(), call:m[2].trim()};
    return {title:line, call:''};
  });
}

function buildData(rows){
  const head=rows[0].map(h=>h.trim());
  const col=n=>head.indexOf(n);
  const iNo=col('No')>=0?col('No'):col('ID');
  const iDate=col('접수일'), iNick=col('닉네임'),
        iQ=col('질문원문'), iA=col('답변원문'), iB=col('추천도서'),
        iT=col('주제'), iG=col('대상'), iK=col('요구유형'), iP=col('공개여부');

  return rows.slice(1).map(r=>{
    const get=i=>(i>=0&&r[i]!=null)?r[i].trim():'';
    const open=get(iP).toUpperCase();
    return {
      id:parseInt(get(iNo),10)||0,
      date:get(iDate),
      nick:get(iNick)||'익명',
      q:get(iQ),
      answer:get(iA),
      books:parseBooks(get(iB)),
      topics:get(iT).split(';').map(s=>s.trim()).filter(Boolean),
      target:get(iG),
      kind:get(iK)||'기타',
      pub:(open===''||open==='Y'||open==='공개')
    };
  })
  .filter(d=>d.id&&d.q&&d.pub)     // 번호·질문이 있고 공개인 것만
  .sort((a,b)=>b.id-a.id);
}

let DATA=[];

/* 화면에 놓을 차례 — 시트에 새 값이 생기면 뒤에 붙는다 */
const KIND_ORDER=['도서관질문','고민상담','상식질문','도서추천','이용안내','자료구입요청','독서질문'];

/* ── 상태 ── */
let activeKind=null, activeTopic=null, term='', scope='q';
const opened=new Set();

const $list=document.getElementById('list');
const $count=document.getElementById('count');
const $filters=document.getElementById('filters');
const $q=document.getElementById('q');

/* ── 필터 단추 ── */
function buildFilters(){
  $filters.innerHTML='';
  const counts={};
  DATA.forEach(d=>counts[d.kind]=(counts[d.kind]||0)+1);

  const known=KIND_ORDER.filter(k=>counts[k]);
  const extra=Object.keys(counts).filter(k=>!KIND_ORDER.includes(k)).sort();
  const kinds=known.concat(extra);

  const all=document.createElement('button');
  all.className='chip';
  all.innerHTML='전체<span class="n">'+DATA.length+'</span>';
  all.setAttribute('aria-pressed','true');
  all.onclick=()=>{activeKind=null;activeTopic=null;render()};
  $filters.appendChild(all);

  kinds.forEach(k=>{
    const b=document.createElement('button');
    b.className='chip';
    b.innerHTML=k+'<span class="n">'+counts[k]+'</span>';
    b.setAttribute('aria-pressed','false');
    b.dataset.kind=k;
    b.onclick=()=>{activeKind=(activeKind===k?null:k);activeTopic=null;render()};
    $filters.appendChild(b);
  });
}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

/* 공백을 뺀 문자열과, 그 각 글자가 원문 몇 번째였는지의 지도를 함께 만든다 */
function squash(s){
  let out='', map=[];
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(/\s/.test(c))continue;
    out+=c.toLowerCase(); map.push(i);
  }
  return {out,map};
}

/* 검색어의 공백을 무시하고 찾아 <mark>로 감싼다 */
function hl(s){
  if(!term)return esc(s);
  const key=term.replace(/\s+/g,'').toLowerCase();
  if(!key)return esc(s);

  const {out,map}=squash(s);
  const spans=[];
  let from=0, at;
  while((at=out.indexOf(key,from))!==-1){
    spans.push([map[at], map[at+key.length-1]+1]);   // 원문 기준 구간
    from=at+key.length;
  }
  if(!spans.length)return esc(s);

  let html='', cur=0;
  spans.forEach(([a,b])=>{
    html+=esc(s.slice(cur,a))+'<mark>'+esc(s.slice(a,b))+'</mark>';
    cur=b;
  });
  return html+esc(s.slice(cur));
}

function flat(s){return s.replace(/\s+/g,'').toLowerCase()}

/* 두 벌의 검색 대상을 미리 만들어 둔다 */
function hay(d,which){
  if(!d._hay){
    const q = flat(d.q + d.nick + d.topics.join('') + d.kind);
    d._hay = {
      q,
      all: q + flat(d.answer + d.books.map(b=>b.title+b.call).join(''))
    };
  }
  return d._hay[which];
}

function hit(d,which){
  const key=flat(term);
  return !key || hay(d,which).includes(key);
}

function matches(d){
  if(activeKind&&d.kind!==activeKind)return false;
  if(activeTopic&&!d.topics.includes(activeTopic))return false;
  return hit(d,scope);
}

function render(){
  [...$filters.children].forEach(b=>{
    const on = b.dataset.kind ? b.dataset.kind===activeKind : !activeKind;
    b.setAttribute('aria-pressed',on?'true':'false');
  });

  const rows=DATA.filter(matches);
  const deep = scope==='all';           // 답변·책까지 강조할지

  let label = rows.length+'건';
  if(activeTopic) label += ' · 주제: '+activeTopic;
  if(term) label += ' · "'+term+'" 검색';
  $count.textContent=label;

  if(!rows.length){
    /* 질문에는 없지만 답변에는 있는 경우, 넓혀 볼 수 있다고 알려 준다 */
    const wider = (scope==='q'&&term)
      ? DATA.filter(d=>(!activeKind||d.kind===activeKind)&&
                       (!activeTopic||d.topics.includes(activeTopic))&&
                       hit(d,'all')).length
      : 0;
    $list.innerHTML='<div class="empty"><p>질문 중에는 그런 낱말이 없어요.</p>'+
      (wider
        ? '<span>답변이나 책 제목까지 넓히면 '+wider+'건이 있습니다. '+
          '<button class="widen" id="widen">넓혀서 찾기</button></span>'
        : '<span>다른 낱말로 찾아보시거나, 도서관에 새 질문을 남겨 주세요.</span>')+
      '</div>';
    const w=document.getElementById('widen');
    if(w)w.onclick=()=>{setScope('all')};
    return;
  }

  $list.innerHTML=rows.map(d=>{
    const open=opened.has(d.id);
    const books=d.books.length
      ? '<div class="books"><div class="books-h">함께 소개한 책</div>'+
        d.books.map(b=>'<div class="book"><span class="t">'+(deep?hl(b.title):esc(b.title))+
        '</span><span class="c">'+esc(b.call)+'</span></div>').join('')+'</div>'
      : '<div class="nobook">이 답변에는 소개한 책이 없습니다.</div>';
    return '<article class="entry'+(open?' open':'')+'" data-id="'+d.id+'">'+
      '<div class="callno">No.'+String(d.id).padStart(3,'0')+'</div>'+
      '<div class="meta"><span class="nick">'+hl(d.nick)+'</span>'+
        '<span class="date">'+d.date+'</span></div>'+
      '<p class="q" data-act="toggle">'+hl(d.q)+'</p>'+
      '<div class="tags">'+
        '<button class="tag kind" data-act="kind" data-v="'+esc(d.kind)+'">'+d.kind+'</button>'+
        d.topics.map(t=>'<button class="tag" data-act="topic" data-v="'+esc(t)+'">'+t+'</button>').join('')+
        '<button class="toggle" data-act="toggle">'+(open?'답변 접기 −':'답변 보기 +')+'</button>'+
      '</div>'+
      '<div class="a"><div class="a-body">'+(deep?hl(d.answer):esc(d.answer))+'</div>'+books+'</div>'+
    '</article>';
  }).join('');
}

/* ── 조작 ── */
$list.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const art=el.closest('.entry'); const id=+art.dataset.id;
  const act=el.dataset.act;
  if(act==='toggle'){ opened.has(id)?opened.delete(id):opened.add(id); render(); }
  if(act==='topic'){ activeTopic=(activeTopic===el.dataset.v?null:el.dataset.v); render(); window.scrollTo({top:0,behavior:'smooth'}); }
  if(act==='kind'){ activeKind=(activeKind===el.dataset.v?null:el.dataset.v); activeTopic=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});

function setScope(v){
  scope=v;
  document.querySelectorAll('.scope-btn').forEach(b=>
    b.setAttribute('aria-pressed', b.dataset.scope===v ? 'true':'false'));
  render();
}
document.querySelectorAll('.scope-btn').forEach(b=>{
  b.onclick=()=>setScope(b.dataset.scope);
});

let timer;
$q.addEventListener('input',e=>{
  clearTimeout(timer);
  timer=setTimeout(()=>{term=e.target.value.trim();render()},120);
});

/* ── 불러오기 ── */
function setStatus(html){ $list.innerHTML='<div class="status">'+html+'</div>'; }

async function fetchSheet(){
  const errs=[];
  for(const base of SHEET_URLS){
    const url=base+(base.includes('?')?'&':'?')+'_t='+Date.now();
    try{
      const r=await fetch(url);
      if(r.ok){
        const t=await r.text();
        if(t && t.trim()) return t;
        errs.push('빈 응답');
      } else errs.push('HTTP '+r.status);
    }catch(e){ errs.push(String(e.message||e)); }
  }
  throw new Error(errs.join(' / '));
}

async function load(){
  setStatus('<span class="spin"></span>질문을 불러오는 중입니다');
  $count.textContent='';
  try{
    const rows=parseCSV(await fetchSheet());
    if(rows.length<2) throw new Error('내용이 비어 있습니다');
    DATA=buildData(rows);
    if(!DATA.length) throw new Error('공개된 질문이 없습니다');

    document.getElementById('stamp').textContent=
      '수록 '+DATA.length+'건 · 최근 갱신 '+DATA[0].date;
    buildFilters();
    render();
  }catch(err){
    $count.textContent='';
    setStatus(
      '<p class="s-title">질문을 불러오지 못했습니다.</p>'+
      '<p class="s-sub">잠시 뒤 다시 시도해 주세요. '+
      '<button class="widen" id="retry">다시 불러오기</button></p>'+
      '<p class="s-detail">'+esc(String(err.message||err))+'</p>');
    const r=document.getElementById('retry');
    if(r)r.onclick=load;
  }
}

/* ── 방문자 세기 (GoatCounter) ── */
load();
window.goatcounter = { path: function(p){ return p || location.pathname; } };</script>
